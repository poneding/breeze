[package]
name = "breeze-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[dependencies]
serde.workspace = true
serde_json.workspace = true
breeze-storage.workspace = true
anyhow.workspace = true
gpui-kit = { workspace = true, features = ["tree-sitter-markdown"] }
# GPUI's stroke options use these cap/join types; reuse its pinned path crate.
lyon_path = "=1.0.19"
breeze-core.workspace = true
breeze-pdf.workspace = true
breeze-reflow.workspace = true
image.workspace = true
# Rasterizes SVG badges and diagrams; the same release GPUI already links.
resvg = "=0.46.0"
# Typesets display formulas with embedded KaTeX fonts (MIT). Render-only build.
ratex-gpui = { version = "=0.4.1", default-features = false }
# Renders Mermaid fences to SVG natively, without a browser (MIT).
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
semver = "=1.0.28"
sys-locale = "=0.3.2"

[lints]
workspace = true

[build-dependencies]
# Embeds `assets/brand/breeze.ico` as the executable's Windows icon resource.
# Already locked through GPUI's manifest build script.
embed-resource = "=3.0.11"

[dev-dependencies]
zip = { version = "=9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
futures.workspace = true
tempfile.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
