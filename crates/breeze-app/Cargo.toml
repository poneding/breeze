[package]
name = "breeze-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[dependencies]
serde.workspace = true
serde_json.workspace = true
breeze-storage.workspace = true
anyhow.workspace = true
gpui-kit.workspace = true
breeze-core.workspace = true
breeze-pdf.workspace = true
breeze-reflow.workspace = true
image.workspace = true
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
semver = "=1.0.28"
sys-locale = "=0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "NSApplication",
    "NSResponder",
    "NSWindow",
] }

[lints]
workspace = true

[dev-dependencies]
zip = { version = "=9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
futures.workspace = true
tempfile.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
