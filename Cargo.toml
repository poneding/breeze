[workspace]
members = ["crates/breeze-core", "crates/breeze-pdf", "crates/breeze-app"]
default-members = ["crates/breeze-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
anyhow = "1"
gpui-kit = "=0.7.0"
pdf_oxide = { version = "=0.3.78", default-features = false, features = ["rendering", "icc"] }
image = { version = "0.25", default-features = false, features = ["png"] }
futures = "0.3"
breeze-core = { path = "crates/breeze-core" }
breeze-pdf = { path = "crates/breeze-pdf" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 0
