[workspace]
members = [
    "crates/breeze-core",
    "crates/breeze-pdf",
    "crates/breeze-app",
    "crates/breeze-storage",
]
default-members = ["crates/breeze-app"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
dirs = "7.0.0"
breeze-storage = { path = "crates/breeze-storage" }
gpui-kit = "=0.7.1"
lopdf = { version = "=0.45.0", default-features = false }
pdf_oxide = { version = "=0.3.78", default-features = false, features = [
    "rendering",
    "icc",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
futures = "0.3"
breeze-core = { path = "crates/breeze-core" }
breeze-pdf = { path = "crates/breeze-pdf" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 0
