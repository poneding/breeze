[workspace]
members = [
    "crates/breeze-core",
    "crates/breeze-pdf",
    "crates/breeze-app",
    "crates/breeze-storage",
    "crates/breeze-reflow",
]
default-members = ["crates/breeze-app"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
dirs = "7.0.0"
breeze-storage = { path = "crates/breeze-storage" }
gpui-kit = "=0.7.1"
lopdf = { version = "=0.45.0", default-features = false }
mupdf = { version = "=0.8.0", default-features = false, features = [
    "base14-fonts",
    "system-fonts",
    # `mupdf-sys` compiles no CJK font, and the safe crate's system loader
    # implements the CJK hook on Windows only. Without a bundled CJK font every
    # Han character looks up a font that does not exist: the glyph is not drawn
    # and the failed lookup costs a millisecond each. These providers install
    # MuPDF's runtime font hooks for CJK and symbol coverage.
    "bundled-fonts-droid",
    "bundled-fonts-noto",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
futures = "0.3"
breeze-core = { path = "crates/breeze-core" }
breeze-pdf = { path = "crates/breeze-pdf" }
breeze-reflow = { path = "crates/breeze-reflow" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 0
